---
name: Super-Linter

on:
  pull_request:
    types: [opened, reopened]
  
permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter@v7.1.0 # x-release-please-version
        env:
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_CHECKOV: false
          FIX_HTML_PRETTIER: true
          FIX_PYTHON_BLACK: true
          FIX_YAML_PRETTIER: true

          # Disable strict Python linters
          PYTHON_PYLINT: false
          PYTHON_FLAKE8: false
          PYTHON_ISORT: false
          PYTHON_MYPY: false
          PYTHON_RUFF: false

          # Keep minimal checking
          VALIDATE_PYTHON: true

          # Allow HTML but no strict formatting
          VALIDATE_HTML: true
          VALIDATE_HTML_PRETTIER: false

          # Disable duplicate code detection
          VALIDATE_JSCPD: false

          # Keep GitHub Actions/YAML checks
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          VALIDATE_YAML_PRETTIER: false
